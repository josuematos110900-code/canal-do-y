<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07060b">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
  <title>Métodos de pagamento · KET SHOP Admin</title>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="alert warning">Introduza apenas dados reais da conta da loja. Um método só aparece na app quando está <b>activo</b>; recomenda-se activá-lo apenas depois de preencher e verificar os dados.</div>
        <div class="card" style="margin-top:16px">
          <div class="card-header"><h2>Métodos configurados</h2><button class="btn btn-primary admin-only" id="pm-new">Novo método</button></div>
          <div class="table-wrap"><table>
            <thead><tr><th>Ordem</th><th>Nome</th><th>Tipo</th><th>Dados</th><th>Estado</th><th></th></tr></thead>
            <tbody id="pm-body"><tr><td colspan="6" class="empty"><span class="spinner"></span></td></tr></tbody>
          </table></div>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>
  <script src="js/config.js"></script>
  <script type="module" src="js/payments.js"></script>
</body>
</html>
