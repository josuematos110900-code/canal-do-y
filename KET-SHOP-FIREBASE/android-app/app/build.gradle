plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ketshop'
    compileSdk 33

    defaultConfig {
        applicationId "com.ketshop"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // NENHUMA dependência externa.
    // A app usa apenas o Android SDK (android.*, org.json, java.net.HttpURLConnection),
    // o que evita downloads de bibliotecas no CodeAssist e problemas de resolução Maven.
}
