<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07060b">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
  <title>Notificações · KET SHOP Admin</title>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="grid two">
          <form class="card" id="notif-form" novalidate>
            <div class="card-header"><h2>Enviar notificação</h2></div>
            <label for="notif-target">Destinatários</label>
            <select id="notif-target"><option value="all">Todos os clientes (não bloqueados)</option><option value="one">Um cliente específico</option></select>
            <div id="notif-user-box" class="hidden">
              <label for="notif-user-search">Cliente</label>
              <input id="notif-user-search" placeholder="Pesquisar por nome ou e-mail">
              <select id="notif-user" size="5" style="margin-top:8px"></select>
            </div>
            <label for="notif-title">Título</label>
            <input id="notif-title" maxlength="120" placeholder="Ex.: Promoção de fim-de-semana">
            <label for="notif-body">Mensagem</label>
            <textarea id="notif-body" maxlength="1000" placeholder="Texto da notificação"></textarea>
            <div class="form-actions"><button class="btn btn-primary" id="notif-send" type="submit">Enviar</button></div>
            <p class="small muted">As notificações automáticas (encomenda recebida, comprovativo recebido, pagamento aprovado/rejeitado, encomenda concluída) são geradas pelo servidor a cada mudança de estado.</p>
          </form>
          <div class="card">
            <div class="card-header"><h2>Notificações recentes</h2><button class="btn btn-sm btn-ghost" id="notif-refresh">Actualizar</button></div>
            <div class="tabs" id="notif-tabs">
              <button class="tab active" data-type="">Todas</button>
              <button class="tab" data-type="general">Gerais</button>
              <button class="tab" data-type="auto">Automáticas</button>
            </div>
            <div class="table-wrap"><table style="min-width:520px">
              <thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Título</th><th>Lida</th></tr></thead>
              <tbody id="notif-body-list"></tbody>
            </table></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
