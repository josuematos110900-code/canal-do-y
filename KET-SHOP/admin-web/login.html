<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07060b">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
  <title>Entrar · KET SHOP Admin</title>
</head>
<body>
  <div class="auth-page">
    <form class="card auth-card" id="login-form" novalidate>
      <img class="logo" src="assets/logo.svg" alt="">
      <h1>KET SHOP</h1>
      <p class="muted" style="text-align:center;margin:4px 0 8px">Painel administrativo</p>
      <div id="login-alert" class="alert hidden" role="alert"></div>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Palavra-passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="form-actions" style="justify-content:stretch">
        <button class="btn btn-primary grow" id="login-btn" type="submit">Entrar</button>
      </div>
      <p class="small muted" style="margin-top:14px">Acesso exclusivo à equipa (administradores e operadores).
        O papel é verificado no servidor.</p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
