<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07060b">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
  <title>Nova palavra-passe · KET SHOP</title>
</head>
<body>
  <!-- Página pública para clientes: aberta a partir do e-mail de recuperação enviado pela app. -->
  <div class="auth-page">
    <form class="card auth-card" id="reset-form" novalidate>
      <img class="logo" src="assets/logo.svg" alt="">
      <h1>KET SHOP</h1>
      <p class="muted" style="text-align:center">Definir nova palavra-passe</p>
      <div id="reset-alert" class="alert hidden" role="alert"></div>
      <div id="reset-fields" class="hidden">
        <label for="pw1">Nova palavra-passe</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="8">
        <label for="pw2">Confirmar palavra-passe</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="8">
        <p class="small muted">Mínimo 8 caracteres, com letras e números.</p>
        <div class="form-actions" style="justify-content:stretch">
          <button class="btn btn-primary grow" id="reset-btn" type="submit">Guardar</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
